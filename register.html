<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create DigiTour Account</title>
  <link rel="icon" href="sources/images/logo-svg/logo-outline-white.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/frontend-extras.css">
  <link rel="stylesheet" href="assets/css/nav-mobile.css">
  <link rel="stylesheet" href="assets/css/chatbot.css">
</head>
<body data-page="register.html">
  <div id="dt-header"></div>
  <section class="auth-shell">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="auth-card overflow-hidden p-0 reveal">
            <div class="text-white p-3 p-md-4 text-center" style="background: linear-gradient(135deg, #232F3E 0%, #E47911 120%);">
              <i class="fa-solid fa-user-plus fa-2x mb-2" style="color:#FFD814"></i>
              <h3 class="h4 fw-bold mb-0 text-white">Join DigiTour</h3>
              <p class="mb-0 small" style="color:rgba(255,255,255,.85)">Create a free tourist account (stored in your browser)</p>
            </div>
            <div class="card-body p-3 p-md-4">
              <form id="register-form">
                <div class="mb-3">
                  <label class="form-label fw-bold">Full Name</label>
                  <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Email</label>
                  <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Phone</label>
                  <input type="tel" name="phone" class="form-control" placeholder="054...">
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Password</label>
                  <input type="password" name="password" class="form-control" required minlength="4">
                </div>
                <button type="submit" class="btn btn-digitour-gold w-100 fw-bold">Create Account</button>
              </form>
              <p class="text-center mt-3 mb-0">Already registered? <a href="login.html" class="fw-bold">Log in</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div id="dt-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/digitour-core.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/chatbot.js"></script>
</body>
</html>
