<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all Ghanaian tourist destinations on DigiTour.">
  <title>Browse All Ghanaian Tourist Destinations | DigiTour Ghana</title>
  <link rel="icon" href="sources/images/logo-svg/logo-outline-white.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/frontend-extras.css">
</head>
<body data-page="destinations.html">
  <div id="dt-header"></div>

  <section class="detail-hero position-relative overflow-hidden dt-dest-banner">
    <div class="dt-section-videos" id="destBannerVideos" aria-hidden="true">
      <div class="dt-section-video dt-img-cycle is-active" style="background-image:url('sources/images/all_tourist_sites/Cape%20Coast%20Castle.jpg')"></div>
      <div class="dt-section-video dt-img-cycle" style="background-image:url('sources/images/all_tourist_sites/Kakum%20National%20Park%20Canopy%20Walkway.jpg')"></div>
      <div class="dt-section-video dt-img-cycle" style="background-image:url('sources/images/all_tourist_sites/Larabanga%20Mosque.jpg')"></div>
      <div class="dt-section-video dt-img-cycle" style="background-image:url('sources/images/all_tourist_sites/Kwame%20Nkrumah%20Memorial%20Park.jpg')"></div>
      <div class="dt-section-video-wash" style="background: linear-gradient(135deg, rgba(35, 47, 62, 0.72), rgba(255, 153, 0, 0.45));"></div>
    </div>
    <div class="container text-center position-relative" style="z-index: 3;">
      <span class="section-eyebrow" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.35)">Full catalogue</span>
      <h1 class="dt-page-hero-title text-white mb-2" id="dest-hero-title">Explore destinations</h1>
      <p class="lead mb-0 mx-auto" style="max-width:560px;color:rgba(255,255,255,.9)">Complete directory — castles, canopy walks, parks, waterfalls, and beaches in a dynamic mixed layout.</p>
    </div>
  </section>

  <div class="py-3" style="background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft)">
    <div class="container d-flex flex-wrap align-items-center justify-content-center gap-2">
      <a href="destinations.html" class="category-pill" data-category=""><i class="fa-solid fa-layer-group"></i> All</a>
      <a href="destinations.html?category=History" class="category-pill" data-category="History"><i class="fa-solid fa-landmark"></i> History</a>
      <a href="destinations.html?category=Nature+%26+Wildlife" class="category-pill" data-category="Nature & Wildlife"><i class="fa-solid fa-tree"></i> Nature & Wildlife</a>
      <a href="destinations.html?category=Beach" class="category-pill" data-category="Beach"><i class="fa-solid fa-umbrella-beach"></i> Beaches</a>
      <a href="destinations.html?category=History+%26+Culture" class="category-pill" data-category="History & Culture"><i class="fa-solid fa-masks-theater"></i> Heritage</a>
      <a href="destinations.html?category=Culture+%26+Heritage" class="category-pill" data-category="Culture & Heritage"><i class="fa-solid fa-palette"></i> Culture</a>
    </div>
  </div>

  <section class="section-shell">
    <div class="container">
      <div class="dt-search-panel mb-4 reveal">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <input type="text" id="search-input" class="form-control" placeholder="Search by attraction title or keyword…">
          </div>
          <div class="col-md-4">
            <select id="region-filter" class="form-select">
              <option value="all">Filter by Region</option>
              <option value="Greater Accra">Greater Accra</option>
              <option value="Ashanti Region">Ashanti Region</option>
              <option value="Central Region">Central Region</option>
              <option value="Eastern Region">Eastern Region</option>
              <option value="Western Region">Western Region</option>
              <option value="Volta Region">Volta Region</option>
              <option value="Savannah Region">Savannah Region</option>
              <option value="Northern Region">Northern Region</option>
              <option value="Upper East Region">Upper East Region</option>
              <option value="Upper West Region">Upper West Region</option>
              <option value="Bono East Region">Bono East Region</option>
              <option value="Bono Region">Bono Region</option>
              <option value="Western North Region">Western North Region</option>
              <option value="Oti Region">Oti Region</option>
              <option value="Ahafo Region">Ahafo Region</option>
              <option value="North East Region">North East Region</option>
            </select>
          </div>
          <div class="col-md-2">
            <span class="dt-badge dt-badge-gold w-100 justify-content-center">
              <span id="filtered-count">0</span> / <span id="total-count">0</span>
            </span>
          </div>
        </div>
      </div>
      <div class="bento-grid" id="destination-container"></div>
    </div>
  </section>

  <div id="dt-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/digitour-core.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
