<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In to DigiTour Ghana</title>
  <link rel="icon" href="sources/images/logo-svg/logo-outline-white.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/frontend-extras.css">
</head>
<body data-page="login.html">
  <div id="dt-header"></div>
  <section class="auth-shell">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div id="login-msg"></div>
          <div class="auth-card overflow-hidden p-0 reveal">
            <div class="text-white p-3 p-md-4 text-center" style="background: linear-gradient(135deg, #232F3E 0%, #E47911 120%);">
              <i class="fa-solid fa-right-to-bracket fa-2x mb-2" style="color:#FFD814"></i>
              <h3 class="h4 fw-bold mb-0 text-white">Welcome back</h3>
              <p class="mb-0 small" style="color:rgba(255,255,255,.85)">Sign in to manage bookings (demo mode)</p>
            </div>
            <div class="card-body p-3 p-md-4">
              <div id="login-error"></div>
              <form id="login-form">
                <div class="mb-3">
                  <label class="form-label fw-bold">Email</label>
                  <input type="email" name="email" class="form-control" required placeholder="kwame@example.com" value="kwame@example.com">
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Password</label>
                  <input type="password" name="password" class="form-control" required value="demo123">
                </div>
                <button type="submit" class="btn btn-digitour-gold w-100 fw-bold">Log In</button>
              </form>
              <p class="small text-secondary mt-3 mb-0">Demo accounts: <code>kwame@example.com</code> / <code>demo123</code> · <code>adwoa@example.com</code> / <code>demo123</code></p>
              <p class="text-center mt-3 mb-0">No account? <a href="register.html" class="fw-bold">Register</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div id="dt-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/digitour-core.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
