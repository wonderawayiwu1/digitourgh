<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DigiTour Ghana interactive map — aerial hybrid, crisp streets, 3D buildings, and destination labels.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Ghana Map | DigiTour Ghana</title>
  <link rel="icon" href="sources/images/logo-svg/logo-outline-white.svg" type="image/svg+xml">
  <link rel="canonical" href="https://digitourgh.netlify.app/map.html">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=map6">
  <link rel="stylesheet" href="assets/css/frontend-extras.css?v=map6">
  <link rel="stylesheet" href="assets/css/nav-mobile.css?v=map6">
  <link rel="stylesheet" href="assets/css/chatbot.css?v=guide2">
  <link rel="stylesheet" href="assets/css/map.css?v=map6">
  <link rel="stylesheet" href="assets/css/responsive.css?v=map6">
  <link rel="manifest" href="site.webmanifest">
</head>
<body data-page="map.html" class="dt-map-page">
  <div id="dt-header"></div>

  <main id="main-content" class="dt-map-app">
    <div id="map" role="application" aria-label="DigiTour Ghana map"></div>

    <!-- Desktop: open tool stack | Mobile: collapses into one FAB -->
    <div class="dt-map-float-tools" id="dtMapFloatTools" aria-label="Map tools">
      <button type="button" class="dt-map-fab" id="dtMapFab" aria-expanded="false" aria-controls="dtMapFabMenu" title="Map menu" aria-label="Open map menu">
        <i class="fa-solid fa-layer-group"></i>
      </button>
      <div class="dt-map-fab-menu" id="dtMapFabMenu" hidden>
        <button type="button" class="dt-map-tool-btn" id="dtMapReset" title="Reset View — Ghana overview" aria-label="Reset View">
          <i class="fa-solid fa-location-crosshairs"></i>
          <span>Reset View</span>
        </button>
        <button type="button" class="dt-map-tool-btn is-active" id="dtMapMode3d" title="3D City View" aria-pressed="true">
          <i class="fa-solid fa-city"></i>
          <span>3D City</span>
        </button>
        <button type="button" class="dt-map-tool-btn" id="dtMapModeAerial" title="Aerial View" aria-pressed="false">
          <i class="fa-solid fa-satellite"></i>
          <span>Aerial</span>
        </button>
        <button type="button" class="dt-map-tool-btn is-active" id="dtMapBuildings" title="Toggle 3D buildings" aria-pressed="true">
          <i class="fa-solid fa-building"></i>
          <span>3D Buildings</span>
        </button>
      </div>
    </div>

    <!-- Desktop side panel / Mobile bottom sheet -->
    <aside id="dtMapPanel" class="dt-map-panel dt-map-sheet" aria-label="Map search and filters">
      <button type="button" class="dt-sheet-handle" id="dtMapSheetHandle" aria-expanded="false" aria-controls="dtMapPanelBody" title="Expand search">
        <span class="dt-sheet-grip" aria-hidden="true"></span>
        <span class="dt-sheet-hint"><i class="fa-solid fa-chevron-up"></i> Swipe up for filters</span>
      </button>

      <div class="dt-map-panel-head dt-sheet-peek">
        <div class="dt-sheet-peek-copy">
          <h1 class="dt-map-panel-title">Explore Ghana</h1>
          <p class="dt-map-panel-sub dt-desktop-only">Smart zoom · 3D buildings · labeled sites</p>
          <div id="dtMapProvider" class="dt-map-provider">Powered by MapTiler</div>
        </div>
        <button type="button" class="dt-map-panel-toggle dt-desktop-only" id="dtMapPanelToggle" aria-expanded="true" aria-controls="dtMapPanelBody" title="Collapse panel">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>

      <div class="dt-sheet-search">
        <label class="visually-hidden" for="map-search">Search destinations</label>
        <div class="dt-sheet-search-wrap">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="map-search" class="form-control" list="map-search-list" placeholder="Search Kakum, Castle, Mole…" autocomplete="off">
        </div>
        <datalist id="map-search-list"></datalist>
      </div>

      <div id="dtMapPanelBody" class="dt-map-panel-body">
        <label class="form-label small fw-bold text-uppercase text-secondary mb-1" for="map-pick">Jump to destination</label>
        <select id="map-pick" class="form-select form-select-sm mb-2">
          <option value="">Choose a destination…</option>
        </select>

        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold text-uppercase text-secondary mb-1" for="map-region">Region</label>
            <select id="map-region" class="form-select form-select-sm">
              <option value="all">All regions</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold text-uppercase text-secondary mb-1" for="map-category">Category</label>
            <select id="map-category" class="form-select form-select-sm">
              <option value="all">All categories</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong class="small"><span id="map-count">0</span> sites</strong>
          <button type="button" class="btn btn-link btn-sm p-0" id="map-fit-all">Fit all</button>
        </div>
        <div id="map-list" class="dt-map-list"></div>
      </div>
    </aside>
  </main>

  <div id="dt-footer" class="d-none"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="assets/js/digitour-core.js?v=cat122"></script>
  <script src="assets/js/storage.js?v=map6"></script>
  <script src="assets/js/translate.js?v=map6"></script>
  <script src="assets/js/main.js?v=map6"></script>
  <script src="assets/js/effects.js?v=map6"></script>
  <script src="assets/js/pages.js?v=map6"></script>
  <script src="assets/js/map.js?v=cat122"></script>
  <script src="assets/js/seo.js?v=map6"></script>
  <script src="assets/js/chatbot.js?v=cat122"></script>
</body>
</html>
