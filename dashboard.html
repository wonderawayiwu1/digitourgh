<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your DigiTour Ghana bookings, reviews, and travel profile.">
  <title>My Dashboard | DigiTour Ghana</title>
  <link rel="icon" href="sources/images/logo-svg/logo-outline-white.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/frontend-extras.css">
  <link rel="stylesheet" href="assets/css/nav-mobile.css">
  <link rel="stylesheet" href="assets/css/chatbot.css">
  <link rel="stylesheet" href="assets/css/map.css">
  <link rel="manifest" href="site.webmanifest">
</head>
<body data-page="dashboard.html">
  <div id="dt-header"></div>
  <main id="main-content" class="section-shell section-soft">
    <div class="container">
      <div id="dash-msg"></div>
      <div id="dash-ticket"></div>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 p-4 reveal">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="avatar-circle" style="width:56px;height:56px;font-size:1.4rem" id="dash-avatar">T</div>
              <div>
                <h4 class="fw-bold mb-0" id="dash-name">Traveller</h4>
                <small class="text-secondary" id="dash-email"></small>
              </div>
            </div>
            <p class="small text-secondary mb-3">Your DigiTour tourist portal — bookings and reviews on this device, with admin copies via Netlify Forms.</p>
            <div id="dash-storage-note" class="mb-3"></div>
            <a href="destinations.html" class="btn btn-digitour-gold btn-sm w-100 mb-2"><i class="fa-solid fa-compass me-1"></i> Explore destinations</a>
            <a href="map.html" class="btn btn-digitour-outline btn-sm w-100 mb-2"><i class="fa-solid fa-globe-africa me-1"></i> Open map</a>
            <a href="inquiry.html" class="btn btn-digitour-outline btn-sm w-100">Ask a question</a>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 reveal">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-calendar-check me-2" style="color:var(--amazon-orange)"></i> My Bookings</h5>
            <div id="dash-bookings"></div>
          </div>
          <div class="card border-0 shadow-sm rounded-4 p-4 reveal">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-star me-2" style="color:var(--amazon-orange)"></i> Community Reviews</h5>
            <div id="dash-reviews"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="dt-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/digitour-core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/seo.js"></script>
  <script src="assets/js/chatbot.js"></script>
  <script>
    document.addEventListener('dt:content-ready', () => {
      const u = DigiTour.getUser();
      const av = document.getElementById('dash-avatar');
      if (av && u) av.textContent = (u.name || 'T').charAt(0).toUpperCase();
    });
  </script>
</body>
</html>
